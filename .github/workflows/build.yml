name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    env:
      # Secrets cannot be used directly in `if:`, so expose a boolean.
      MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: codex-setup-windows-x64.exe
          - os: macos-15
            artifact: codex-setup-macos-arm64
          - os: macos-15-intel
            artifact: codex-setup-macos-x64
          # Oldest supported glibc, so the binary runs on Ubuntu 22.04 and 24.04.
          - os: ubuntu-22.04
            artifact: codex-setup-linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Linux GUI runtime (GTK + WebKit2GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-webkit2-4.0 libwebkit2gtk-4.0-37
          python -m pip install -e ".[linux-gui]"

      - name: Test
        run: python -m pytest -q

      - name: macOS signing disabled
        if: runner.os == 'macOS' && env.MACOS_SIGNING != 'true'
        run: echo "::notice::macOS signing secrets not set; building unsigned"

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare notarization API key
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build and smoke test
        run: python scripts/build.py --smoke

      - name: Notarize
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/notarize_macos.sh "dist/${{ matrix.artifact }}"

      - name: Gatekeeper check
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/gatekeeper-check"
          rm -rf "$copy"
          cp "dist/${{ matrix.artifact }}" "$copy"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$copy"
          spctl --assess --type execute -vv "$copy" || true
          out="$(perl -e 'alarm 60; exec @ARGV' "$copy" --version)"
          echo "$out"
          if [ -z "$out" ]; then
            echo "::error::Quarantined binary did not print a version"
            exit 1
          fi
          rm -f "$copy"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: python scripts/build.py --app --smoke

      - name: Notarize app
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/notarize_macos.sh "dist/Codex Setup.app"

      - name: Gatekeeper check (app)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          zip="$(ls dist/codex-setup-macos-*-app.zip | head -n 1)"
          work="$RUNNER_TEMP/gatekeeper-app"
          rm -rf "$work"
          mkdir -p "$work"
          cp "$zip" "$work/app.zip"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$work/app.zip"
          ditto -x -k "$work/app.zip" "$work/out"
          app="$work/out/Codex Setup.app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee "$work/spctl.txt"
          grep -q "accepted" "$work/spctl.txt"
          out="$(perl -e 'alarm 60; exec @ARGV' "$app/Contents/MacOS/Codex Setup" --version)"
          echo "$out"
          if [ -z "$out" ]; then
            echo "::error::Quarantined app did not print a version"
            exit 1
          fi
          rm -rf "$work"

      - name: Clean up signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact }}-app
          path: |
            dist/${{ matrix.artifact }}-app.zip
            dist/${{ matrix.artifact }}-app.zip.sha256
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: List files
        run: ls -l release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
