name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: codex-setup-windows-x64.exe
          - os: macos-15
            artifact: codex-setup-macos-arm64
          - os: macos-15-intel
            artifact: codex-setup-macos-x64
          # Oldest supported glibc, so the binary runs on Ubuntu 22.04 and 24.04.
          - os: ubuntu-22.04
            artifact: codex-setup-linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build and smoke test
        run: python scripts/build.py --smoke

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: List files
        run: ls -l release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
